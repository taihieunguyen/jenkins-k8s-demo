apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-private-app
  labels:
    app: nodejs-private
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-private
  template:
    metadata:
      labels:
        app: nodejs-private
    spec:
      # Gọi secret chứa quyền truy cập vào Docker Hub Private
      imagePullSecrets:
      - name: dockerhub-private-key
      containers:
      - name: web-container
        image: docker.io/nguyentaihieu/nodejs-demo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-private-service
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 32000
  selector:
    app: nodejs-private